file: mendel.csv
origin: >
  G. Mendel, "Versuche über Pflanzen-Hybriden", Verhandlungen des naturforschenden
  Vereines in Brünn 4, 1866, pp. 3-47. The counts are typed from the first two
  experiments and from the cross that combines seed shape and seed colour, and the
  ratio column holds the proportions that Mendel's model predicts.
license: The values are facts from a published table and are in the public domain.
